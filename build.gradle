//本地的插件依赖和仓库, 只能将仓库和依赖地址写入到buildscript中, 否则会报错
buildscript {
    repositories {
        maven { url "$rootDir/lib/release" }
    }
    dependencies {
        classpath "com.self:library:1.1"
    }
}


