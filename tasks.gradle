task "taks1" {
    //任务的配置:配置阶段执行
    println "config task1"
    //任务的执行:在执行阶段执行先执行doFirst,后执行doLast
    doFirst {
        println "do first"
    }
    doLast {
        println "do last"
    }
}
task "task1_1" {
    //任务的依赖:在执行task1_1之前先执行task1
    group = "group"
    dependsOn tasks."taks1"
    //任务的配置:配置阶段执行,
    println("config task1_1")
    doFirst {
        println "do first task1_1"
    }
    doLast {
        println "do last task1_1"
    }
}
//在task外部定义doFirst、doLast行为
taks1.doFirst {
    println it.description
}
task1_1.doLast {
    println "group " + it.group
}


