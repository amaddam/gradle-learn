//规则是为了简化构建脚本的编写，它可以根据一定的规则自动创建任务，而不需要我们手动创建
//如果执行noExistTask任务,会报错,但是如果使用规则,就不会报错,会执行规则中的内容
//下面的全局规则要小心使用, 因为会创建隐藏任务, 属性似乎也会被创建
//tasks.addRule("noneTask") { String taskName ->
//    task(taskName) {
//        doLast {
//            println "该${taskName}任务不存在，请查证后再执行"
//        }
//    }
//}

//如果代码中没有pingAnyServer相关的方法, 在控制台执行./gradlew pingAnyServer, 会发现打印了Pinging: AnyServer
tasks.addRule("Pattern: ping<ID>") { String taskName ->
    if (taskName.startsWith("ping") && !project.tasks.findByName(taskName)) {
        task(taskName) {
            doLast {
                println "Pinging: " + (taskName - 'ping')
            }
        }
    }
}

//如果执行./gradlew groupPing, 就算代码中没有pingServer1和pingServer2相关的方法, 也不会报错, 基于规则的任务上创建 dependentOn 关系
tasks.register('groupPing') {
    dependsOn 'pingServer1', 'pingServer2'
}

//在执行./gradlew task27 -Pattr时不会执行task27(-P{attr}是传参)
//注意一些创建隐藏任务的方法, 比如上面的 tasks.addRule("noneTask"), 会创建隐藏任务,也包括attr属性
// 在执行!project.hasProperty("attr"), 会创建一个任务, 这个时候打印properties, 会发现有一个attr属性
task task27 {
    doLast {
        println "Task27.."
    }
}

task27.onlyIf {
    //只有当返回true时才会执行task27
    !project.hasProperty("attr")
}

//当你运行 gradle 命令而没有指定特定的任务时，Gradle 将会执行在 defaultTasks 属性中指定的任务。
