//任务的依赖
//1.参数依赖
task task4 {
    doLast {
        println "Task4.."
    }
}
task 'task5' {
    doLast {
        println "Task5.."
    }
}
//参数方式依赖: dependsOn后面用冒号
task task6(dependsOn: [task4, task5]) {
    doLast {
        println "Task6.."
    }
}
//会先执行task4,task5,再执行task6

//2.内部依赖
task task7 {
    doLast {
        println "Task7.."
    }
}
task task8 {
    doLast {
        println "Task8.."
    }
}
//内部依赖: dependsOn后面()内传参, 用空格或者等号都可以, dependsOn只是依赖, 如果有重复的, 那么只会执行一次
task task9 {
    dependsOn(task7, task8)
    dependsOn task7, task8
    dependsOn = [task7, task8]
    doLast {
        println "Task9.."
    }
}

//3.外部依赖
task task10 {
    doLast {
        println "Task10.."
    }
}
task task11 {
    doLast {
        println "Task11.."
    }
}
task task12 {
    doLast {
        println "Task12.."
    }
}
//同样的, 外部依赖也可以用空格也可以用等号, 依赖的任务也只会执行一次
task12.dependsOn task10, task11
task12.dependsOn(task10, task11)
task12.dependsOn = [task10, task11]

//通过task的create方法创建任务
