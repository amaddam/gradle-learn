// 通过使用 defaultTasks 属性,你可以定义在运行 gradle 命令时默认执行的任务集合，这些任务通常是项目的主要构建任务。
//比如下面两个任务, 在执行./gradlew时, 且没有指定任务名, 会执行task28和task29
defaultTasks 'task28', 'task29'
tasks.register('task28') {
