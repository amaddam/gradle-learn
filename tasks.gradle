//自定义的task
class CustomTask extends DefaultTask {
//@TaskAction表示Task本身要执行的方法
    @TaskAction
    def doSelf() {
        println "CustomTask 自身 在执行的in doSelf"
    }
}

//自定义的task启动名称是myDefinitionTask而不是task19 , task19只是一个实例, MyDefinitionTask并没有被显式的定义
def task19 = task MyDefinitionTask(type: CustomTask)
task19.doFirst() {
    println "MyDefinitionTask 执行之前 执行的 doFirst方法"
}
task19.doLast() {
    println "MyDefinitionTask 执行之后 执行的 doLast方法"
}

//调用自定义的CustomTask
task(task20, type: CustomTask) {
    doFirst {
        println "doFirst Task20.."
    }
    doLast {
        println "doLast Task20.."
    }
}
