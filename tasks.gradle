//归档文件
//ZIP: https://docs.gradle.org/current/dsl/org.gradle.api.tasks.bundling.Zip.html#org.gradle.api.tasks.bundling.Zip
//Zip，Tar，Jar，War 和Ear 的生成都是通过 ArchiveTask 类来实现的，这些任务都继承自 Copy 类，因此，它们都具有 Copy 类的所有功能。
task task35(type: Zip) {
    doLast {
        from('src/main/resources/file-tree-operate')
        //into方法没有作用, 最终生成的zip文件会在build/distributions目录下
        //into('src/main/resources/file-generated')
        //指定文件夹
        destinationDirectory = file('src/main/resources/file-archive')
        //指定文件名称, 默认名称为[archiveBaseName]-[archiveAppendix]-[archiveVersion]-[archiveClassifier].[archiveExtension]
        archiveFileName = 'myZip.zip'
    }
}

task task36 {
    doLast {
        //通过Project.zipTree(java.lang.Object)方法，将一个zip文件转换为一个文件树
        //.visit方法遍历文件树,可以获取文件夹的名称,文件的名称, 直接forEach只能获取文件的名称
        zipTree('src/main/resources/file-archive/myZip.zip').visit {
            println it.name
        }
        //如果压缩包myZip.zip是在项目的build/distributions目录下, 可以直接使用zipTree('myZip.zip')来获取文件树
    }
}